<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0d1117"/>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="80" y="118" font-size="30" font-weight="700" fill="#748190" letter-spacing="1">PROVASIGN</text>
    <text x="80" y="196" font-size="58" font-weight="800" fill="#e6edf3">Questions your coding agent</text>
    <text x="80" y="262" font-size="58" font-weight="800" fill="#e6edf3">can't answer alone.</text>

    <rect x="80" y="318" width="330" height="214" rx="12" fill="#161b22" stroke="#273241" stroke-width="2"/>
    <rect x="80" y="318" width="330" height="6" rx="3" fill="#f0b86e"/>
    <text x="104" y="376" font-size="38" font-weight="800" fill="#e6edf3">Stele</text>
    <text x="104" y="414" font-size="21" fill="#9aa7b4">Before the plan:</text>
    <text x="104" y="442" font-size="21" fill="#9aa7b4">does this break what</text>
    <text x="104" y="470" font-size="21" fill="#9aa7b4">we decided?</text>
    <text x="104" y="510" font-size="20" font-weight="700" fill="#f0b86e">Preview</text>

    <rect x="435" y="318" width="330" height="214" rx="12" fill="#161b22" stroke="#273241" stroke-width="2"/>
    <rect x="435" y="318" width="330" height="6" rx="3" fill="#7dd3fc"/>
    <text x="459" y="376" font-size="38" font-weight="800" fill="#e6edf3">Prism</text>
    <text x="459" y="414" font-size="21" fill="#9aa7b4">Before the edit:</text>
    <text x="459" y="442" font-size="21" fill="#9aa7b4">did it change everything</text>
    <text x="459" y="470" font-size="21" fill="#9aa7b4">it had to?</text>
    <text x="459" y="510" font-size="20" font-weight="700" fill="#7dd3fc">32/32 change tasks</text>

    <rect x="790" y="318" width="330" height="214" rx="12" fill="#161b22" stroke="#273241" stroke-width="2"/>
    <rect x="790" y="318" width="330" height="6" rx="3" fill="#38d996"/>
    <text x="814" y="376" font-size="38" font-weight="800" fill="#e6edf3">Shale</text>
    <text x="814" y="414" font-size="21" fill="#9aa7b4">After the edit:</text>
    <text x="814" y="442" font-size="21" fill="#9aa7b4">what did the agent</text>
    <text x="814" y="470" font-size="21" fill="#9aa7b4">actually do?</text>
    <text x="814" y="510" font-size="20" font-weight="700" fill="#38d996">On every agent PR</text>
  </g>
  <text x="80" y="584" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="22" fill="#748190">provasign.dev  ·  local, open-source tools for agent-written code</text>
</svg>
